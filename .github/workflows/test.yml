name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Google Chrome is preinstalled on ubuntu-latest and is required by the
      # render smoke test (test/smoke-render.test.mjs). Fail loudly here if a
      # future runner image drops it, rather than letting the smoke test skip.
      - run: google-chrome --version
      - run: npm install
      - run: npm test # includes node --test suites + the headless-Chrome render smoke test
      - run: npm run typecheck
